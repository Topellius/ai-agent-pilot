name: P5.2.0 Zero-Cost CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Python tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v
